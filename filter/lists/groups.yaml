# The allowlist's groups: hosts by tool or service, so a layer turns on a
# group instead of listing hostnames. See investigator-design.md, "Egress
# filtering". An entry is a host or "*.suffix" (subdomains only, not the
# suffix itself), with an optional port: 443 by default, or 80. The filter
# allows no other ports.
#
# Hosts marked "unverified" were written from what we knew, not checked
# against a tool's real traffic; the filter's denial log shows what's missing.
groups:
  claude-code:
    description: Claude Code, its API and its installer
    hosts:
      - api.anthropic.com
      - claude.ai
      - platform.claude.com      # sign-in (unverified)
      - console.anthropic.com    # sign-in (unverified)
      - statsig.anthropic.com    # telemetry (unverified)
      - downloads.claude.ai      # the installer's downloads (unverified)
  ubuntu:
    description: Ubuntu's package mirrors (apt uses plain http)
    hosts:
      - archive.ubuntu.com:80
      - "*.archive.ubuntu.com:80"
      - security.ubuntu.com:80
      - ports.ubuntu.com:80        # arm64
      - "*.ports.ubuntu.com:80"
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
  docker-apt:
    description: Docker's apt repository
    hosts:
      - download.docker.com
  docker-hub:
    description: Pulls from Docker Hub
    hosts:
      - registry-1.docker.io
      - auth.docker.io
      - index.docker.io
      - production.cloudflare.docker.com
      - production.cloudfront.docker.com   # blobs (seen 2026-11-22)
  github-public:
    description: Anonymous GitHub (public clones, releases, ghcr.io); authenticated work goes to the broker
    hosts:
      - github.com
      - api.github.com
      - codeload.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      - ghcr.io
      - pkg-containers.githubusercontent.com
  gitlab-public:
    description: Anonymous gitlab.com (public clones); authenticated work goes to the broker
    hosts:
      - gitlab.com
  go:
    description: The Go toolchain and module proxy
    hosts:
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com   # some module zips (unverified); broad, so only in this group
      - go.dev
      - dl.google.com
  node:
    description: npm and Node.js downloads
    hosts:
      - registry.npmjs.org
      - nodejs.org
  python:
    description: PyPI
    hosts:
      - pypi.org
      - files.pythonhosted.org
  terraform:
    description: Terraform's registry and releases
    hosts:
      - registry.terraform.io
      - releases.hashicorp.com
  aws-docs:
    description: AWS documentation
    hosts:
      - docs.aws.amazon.com
  docs-common:
    description: Documentation for common languages and tools
    hosts:
      - pkg.go.dev
      - docs.python.org
      - developer.mozilla.org
      - docs.docker.com
      - docs.github.com
      - docs.gitlab.com
      - kubernetes.io
      - developer.hashicorp.com
