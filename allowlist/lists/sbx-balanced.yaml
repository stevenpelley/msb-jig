# Docker Sandboxes' "balanced" defaults, copied from `sbx policy ls --json`
# (sbx v0.54.0, 2026-11-23): its rules default-ai-services,
# default-package-managers, default-code-and-containers,
# default-cloud-infrastructure, default-os-packages and
# default-cert-validation, one group each.
#
# Changes from sbx's list, so it means the same here:
# - sbx's "**.x" (any subdomain) is our "*.x", which already matches any
#   depth. sbx's single-label "*.x" also becomes "*.x" (slightly broader).
# - "crl*.digicert.com:80" is written out as crl3 and crl4: our entries
#   have no globs inside a label.
# - Hosts a broker provider serves are not here but in groups.yaml, marked
#   with their provider, so they leave the allowlist when the broker serves
#   them: api.anthropic.com (anthropic), github.com and api.github.com
#   (github), gitlab.com (gitlab), *.amazonaws.com (aws).
# - sbx's "**.github.com" would include api.github.com, so it is narrowed
#   to the subdomains in groups.yaml (codeload; uploads with the github
#   provider).
groups:
  sbx-ai-services:
    description: AI vendors' APIs and sign-in (sbx default-ai-services)
    hosts:
      - statsig.anthropic.com
      - platform.claude.com
      - mcp-proxy.anthropic.com
      - downloads.claude.ai
      - claude.com
      - bridge.claudeusercontent.com
      - "*.openai.com"
      - chatgpt.com
      - "*.chatgpt.com"
      - "*.oaistatic.com"
      - "*.oaiusercontent.com"
      - cdn.openaimerge.com
      - cursor.com
